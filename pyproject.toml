[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qaos-common"
version = "0.2.1"
description = "Shared, deterministic data contracts and utilities for QAOS projects"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "QAOS" }]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "defusedxml>=0.7,<1",
  "lxml>=5,<7",
]

[project.optional-dependencies]
images = ["Pillow>=12.3,<13"]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.9",
  "mypy>=1.14,<2",
  "build>=1.2,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qaos_common"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["qaos_common"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["qaos_common"]
